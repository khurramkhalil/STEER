apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: steer-data
  namespace: gp-engine-mizzou-dcps
spec:
  # rook-cephfs is the active RWX (ReadWriteMany) + expandable class in this
  # namespace (matches the other shared PVCs here).
  accessModes:
    - ReadWriteMany
  storageClassName: rook-cephfs
  resources:
    requests:
      storage: 100Gi

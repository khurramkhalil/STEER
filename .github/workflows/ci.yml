name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # The STEER unit tests only need torch (CPU) and pytest -- not the full
        # training stack (CUDA/hydra/wandb) -- so keep CI fast and lightweight.
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pytest==8.3.4

      - name: Run tests
        run: pytest

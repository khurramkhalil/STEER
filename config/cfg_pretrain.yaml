# ARC training config

defaults:
  - arch: trm
  - _self_
  - experiment: null   # selectable per-paper experiment (see config/experiment/)

hydra:
  output_subdir: null

# Data path
data_paths: ['data/arc-aug-1000']
data_paths_test: []

evaluators:
  - name: arc@ARC

# Hyperparams - Training
global_batch_size: 768

epochs: 100000
eval_interval: 10000
checkpoint_every_eval: False # resume.pt is saved every eval; HF/full artifact only at the end

lr: 1e-4
lr_min_ratio: 1.0
lr_warmup_steps: 2000

# Standard hyperparameter settings for LM, as used in Llama
beta1: 0.9
beta2: 0.95
weight_decay: 0.1
puzzle_emb_weight_decay: 0.1

# Hyperparams - Puzzle embeddings training
puzzle_emb_lr: 1e-2

seed: 0
deterministic: False # enable deterministic cuDNN/cuBLAS kernels (slower, bit-exact)
auto_resume: True # resume from checkpoint_path/resume.pt if present (preemption-safe)
min_eval_interval: 0 # when to start the eval
log_interval: 50 # stdout metric print cadence (in steps)

ema: False # use Exponential-Moving-Average
ema_rate: 0.999 # EMA-rate
freeze_weights: False # If True, freeze weights and only learn the embeddings

# STEER regularization (lambda=0 disables it; see steer/ and config/experiment/)
steer_lambda: 0.0
steer_epsilon_viol: 0.1
steer_epsilon_stab: 0.01
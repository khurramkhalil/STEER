# @package _global_
# Generalization regime (1M augmented puzzles) -- unregularized TRM baseline.
# Select with:  python pretrain.py experiment=aug_baseline

data_paths: ["data/sudoku-extreme-1k-aug-1000"]
evaluators: []

epochs: 50000
eval_interval: 1000

lr: 4e-4
puzzle_emb_lr: 4e-4
weight_decay: 1.0
puzzle_emb_weight_decay: 1.0

global_batch_size: 512
ema: True

steer_lambda: 0.0

project_name: STEER_PAPER_AUGMENTED
run_name: aug_baseline

arch:
  mlp_t: True
  pos_encodings: none
